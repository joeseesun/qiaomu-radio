name: 功能建议
description: 提议一个聚焦于收听体验的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 用户需要
      description: 这个建议解决什么具体问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
